// ===== AUDIO =====
let ac=null;
function initAudio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}}
function snd(t){
 if(!ac||ac.state!=="running")return;
 try{
  const n=ac.currentTime;
  const tone=(type,f1,f2,v,d)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d*.6);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)};
  if(t==="ok")tone("sine",600,1200,.1,.3);
  else if(t==="ko")tone("square",200,150,.12,.4);
  else if(t==="sniper"){
   const L=ac.sampleRate*.5,b=ac.createBuffer(1,L,ac.sampleRate),d=b.getChannelData(0);
   for(let i=0;i<L;i++)d[i]=Math.random()*2-1;
   const s=ac.createBufferSource();s.buffer=b;
   const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=500;
   const g=ac.createGain();g.gain.setValueAtTime(1,n);g.gain.exponentialRampToValueAtTime(.01,n+.4);
   s.connect(f);f.connect(g);g.connect(ac.destination);s.start(n);
   tone("sine",120,30,.8,.6);
  }
 }catch(e){}
}

// ===== VUE DE DESSUS =====
const cv=document.getElementById("bg"),cx=cv.getContext("2d");
let W,H,Z,OX,OY;
function rs(){
 const D=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);
 Z=Math.min(W,H)/35;OX=W/2;OY=H/2+50;
}
addEventListener("resize",rs);rs();
const pj=(x,z)=>({x:OX+x*Z,y:OY+z*Z});
function box(x,z,w,d,c){
 const p=pj(x-w/2,z-d/2);
 cx.fillStyle=c;cx.fillRect(p.x,p.y,w*Z,d*Z);
 cx.strokeStyle="rgba(0,0,0,.5)";cx.lineWidth=2;cx.strokeRect(p.x,p.y,w*Z,d*Z);
}
function anim(ts){
 cx.fillStyle="#0f172a";cx.fillRect(0,0,W,H);
 const a=pj(-18,-18),b=pj(18,10);
 cx.fillStyle="#1e293b";cx.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);
 cx.strokeStyle="#334155";cx.lineWidth=4;cx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);
 cx.strokeStyle="rgba(71,85,105,.2)";cx.lineWidth=1;
 for(let i=-18;i<=18;i+=2){const p=pj(i,-18),q=pj(i,10);cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}
 for(let i=-18;i<=10;i+=2){const p=pj(-18,i),q=pj(18,i);cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}
 box(-8,-12,6,4,"#475569");box(-2,-9,4,2,"#94a3b8");box(8,-5,4,3,"#64748b");
 const p=(ts/7000)%1,go=p<.5,u=go?p*2:2-p*2;
 const fx=-8+16*u,fz=-10+5*u;
 box(fx,fz,1.5,2,"#d97706");box(fx,fz+1.5,1,1,"#334155");
 if(go)box(fx,fz+2.5,1.2,1.2,"#c9a97a");
 else{box(8,-5,1.2,1.2,"#c9a97a");box(-8,-11,1.2,1.2,"#c9a97a")}
 requestAnimationFrame(anim);
}
requestAnimationFrame(anim);

// ===== MUSIQUE (fichier choisi par le joueur) =====
const mus=new Audio();mus.loop=true;mus.volume=.5;
function pickMusic(){document.getElementById("mf").click()}
document.getElementById("mf").onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 mus.src=URL.createObjectURL(f);mus.play().catch(()=>{});
 document.querySelector(".mu").textContent="🎵 "+f.name.slice(0,28);
};
function toggleMusic(){
 if(!mus.src){pickMusic();return}
 if(mus.paused)mus.play();else mus.pause();
 document.getElementById("mt").textContent=mus.paused?"🔇":"🎵";
}

 setScore();
}
function P(h){$("pb").innerHTML=h;$("panel").classList.add("s")}
function closeP(){$("panel").classList.remove("s")}

function openQuiz(k){
 snd("click");
 cur=k;
 const d=S[si].q[k],o=shuf([[d[1],1],[d[2],0],[d[3],0]]);
 let h='<div class="tag">QUIZ '+(k+1)+'/5</div><h2>'+d[0]+'</h2>';
 if(done[k]){
  h+='<div class="fb ok s">'+EXP[si][k]+'<b>Chiffre : '+S[si].c[k]+'</b></div>';
 }else{
  o.forEach(x=>{h+='<button class="qo" data-k="'+x[1]+'">'+x[0]+'</button>'});
  h+='<div class="fb" id="fb"></div>';
 }
 h+='<button class="btn bs" onclick="closeP()">FERMER</button>';
 P(h);
 document.querySelectorAll(".qo").forEach(b=>b.onclick=()=>ans(b));
}
function ans(b){
 if(done[cur])return;
 const fb=$("fb");
 if(b.dataset.k==="1"){
  b.classList.add("ok");done[cur]=1;
  const dg=S[si].c[cur];got[cur]=dg;
  const sl=$("sl"+cur);sl.textContent=dg;sl.classList.add("f");
  $("ic"+cur).classList.add("d");$("lb"+cur).classList.add("d");
  score+=100;setScore();snd("ok");
  document.querySelectorAll(".qo").forEach(x=>x.disabled=true);
  fb.className="fb ok s";fb.innerHTML="✔ Bonne réponse ! "+EXP[si][cur]+"<b>Chiffre du code : "+dg+"</b>";
  if(done.filter(Boolean).length===5)$("ob").textContent="Indices trouvés : va à la porte 🔒";
 }else{
  b.classList.add("ko");b.disabled=true;
  score=Math.max(0,score-20);setScore();snd("ko");
  fb.className="fb ko s";fb.textContent="Mauvaise réponse (−20). Réessaie.";
 }
}

function renderLock(er){
 const d=[0,1,2,3,4].map(i=>"<span>"+(entry[i]||"")+"</span>").join("");
 const hint=[0,1,2,3,4].map(i=>got[i]||"_").join(" ");
 const kp=[1,2,3,4,5,6,7,8,9].map(n=>'<button onclick="key('+n+')">'+n+'</button>').join("")+'<button class="c" onclick="key(\'C\')">C</button><button onclick="key(0)">0</button><button class="k" onclick="key(\'OK\')">OK</button>';
 P('<div class="tag">PORTE DE SORTIE</div><h2>Entre le code à 5 chiffres</h2><div class="cd'+(er?" er":"")+'">'+d+'</div><div class="hint">Chiffres trouvés : '+hint+'</div><div class="kp">'+kp+'</div><button class="btn bs" onclick="closeP()">FERMER</button>');
}
function openLock(){snd("click");entry="";renderLock()}
function key(k){
 snd("click");
 if(k==="C"){entry="";renderLock();return}
 if(k==="OK"){
  if(entry===S[si].c){
   snd("sniper");score+=200;setScore();closeP();
   if(si===9){$("egt").textContent="Score final : "+score+" / 7000";$("eg").classList.remove("hid")}
   else{$("esd").textContent="Scène "+(si+1)+" terminée. Score : "+score;$("es").classList.remove("hid")}
  }else{snd("ko");entry="";renderLock(true)}
  return;
 }
 if(entry.length<5){entry+=k;renderLock()}
}
function startGame(){initAudio();$("intro").classList.add("hid");si=0;score=0;load()}
function nextScene(){$("es").classList.add("hid");si++;load()}
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Défouloir du Dock</title>
<style>
:root{--bg1:#fff1cc;--bg2:#ffc873;--tx:#2b2118;--card:#fff;--ac:#e8590c;--ok:#2f9e44;--ko:#e03131;--mut:#6b5b4b;--hole:#7a4a21;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#241a10;--bg2:#3d2a15;--tx:#fdf3e3;--card:#33261a;--ac:#ff922b;--ok:#69db7c;--ko:#ff8787;--mut:#c9b79f;--hole:#4a2c12}}
:root[data-theme="dark"]{--bg1:#241a10;--bg2:#3d2a15;--tx:#fdf3e3;--card:#33261a;--ac:#ff922b;--ok:#69db7c;--ko:#ff8787;--mut:#c9b79f;--hole:#4a2c12}
*{margin:0;padding:0;box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body.shk{animation:shk .22s}
.scr{height:100%;max-width:520px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:10px}
#hub{overflow-y:auto}
.hid{display:none!important}
h1{font-size:26px;text-align:center;letter-spacing:1px;line-height:1.1}
.sub{text-align:center;color:var(--mut);font-size:13px}
.meter{background:var(--card);border-radius:14px;padding:10px 12px}
.row{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:6px}
.bar{height:14px;border-radius:8px;background:rgba(127,127,127,.25);overflow:hidden}
#fill{height:100%;width:100%;border-radius:8px;background:linear-gradient(90deg,var(--ok),#fab005,var(--ko));background-size:300% 100%;transition:width .5s,background-position .5s}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);text-align:left;border:0;font:inherit;color:var(--tx);width:100%;flex-shrink:0}
.card:active{transform:translateY(3px);box-shadow:none}
.card i{font-style:normal;font-size:36px}
.card b{display:block;font-size:16px}
.card small{color:var(--mut);font-size:12px;line-height:1.3}
.tg{display:flex;gap:8px;justify-content:center;flex-shrink:0}
.tg button{background:var(--card);border:2px solid var(--ac);color:var(--ac);border-radius:14px;padding:7px 12px;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
#tot,#zen{text-align:center;font-weight:800;flex-shrink:0}
#zen{color:var(--ok)}
.team{font-size:11px;color:var(--mut);text-align:center;line-height:1.4;flex-shrink:0;padding-bottom:8px}
.top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.top button{background:var(--card);border:2px solid var(--ac);color:var(--ac);border-radius:14px;padding:7px 11px;font:inherit;font-weight:800;cursor:pointer}
.top span{flex:1;text-align:center}
#cap{min-height:46px;background:var(--card);border-radius:14px;padding:9px 12px;font-size:14px;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center}
#board{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:16px}
.b0{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:center}
.hole{position:relative;aspect-ratio:1;background:var(--hole);border-radius:50% 50% 14px 14px;overflow:hidden;box-shadow:inset 0 -10px 0 rgba(0,0,0,.35);cursor:pointer}
.m{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateY(105%);transition:transform .14s}
.m.up{transform:translateY(4%)}
.m span{font-size:min(13vw,56px);line-height:1}
.m small{font-size:11px;font-weight:800;background:var(--card);color:var(--tx);border-radius:8px;padding:1px 6px;margin-top:2px}
.rim{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#c9904f,#a0692f);border-radius:0 0 14px 14px}
.mail{position:absolute;top:0;left:0;width:170px;background:#fff;color:#222;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;border-left:6px solid var(--ko);box-shadow:0 3px 8px rgba(0,0,0,.3);cursor:pointer;will-change:transform}
.mail small{font-weight:600;font-size:11px;opacity:.75}
.mail.g{border-left-color:var(--ok);background:#ebfbee}
.mail.st::after{content:attr(data-s);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;color:var(--ko);background:rgba(255,255,255,.88);border:4px solid currentColor;border-radius:8px;transform:rotate(-10deg) scale(1.15);animation:st .25s}
.mail.g.st::after{color:var(--ok)}
.b2{display:flex;flex-direction:column;gap:12px}
#spk{display:flex;align-items:center;gap:10px}
#spk span{font-size:52px;animation:bob 1s infinite}
#sp{flex:1;background:var(--card);border-radius:16px;padding:12px;font-size:14px;font-weight:600;min-height:76px;display:flex;align-items:center}
#bg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}
.cell{background:var(--card);color:var(--tx);border:3px solid transparent;border-radius:14px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;padding:6px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.cell.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.cell.no{animation:shk .25s;border-color:var(--ko)}
#dw,#pw{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#dbd{width:min(88vw,50vh,460px);aspect-ratio:1;border-radius:50%;position:relative;background:radial-gradient(circle,#e03131 0 8%,#2f9e44 8% 16%,#fff 16% 40%,#222 40% 48%,#e03131 48% 70%,#222 70% 100%);box-shadow:0 0 0 8px #7a4a21,0 8px 20px rgba(0,0,0,.4)}
#xh,.dt{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
#xh{font-size:34px;color:#fab005;text-shadow:0 0 4px #000,0 0 8px #000;font-weight:900}
.dt{font-size:24px;animation:fade 1.6s forwards}
#pe{font-size:min(45vw,190px);line-height:1}
#pe.hit{animation:shk .18s}
.pb{width:70%}
.bl{position:absolute;top:0;left:0;width:76px;height:96px;border-radius:50% 50% 48% 48%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;will-change:transform;box-shadow:inset -8px -8px 0 rgba(0,0,0,.15)}
.bl i{font-style:normal;font-size:36px}
.bl small{font-size:11px;font-weight:800;background:rgba(255,255,255,.9);color:#222;border-radius:8px;padding:0 5px}
#res{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:22px;z-index:30}
#res.s{display:flex}
#res>div{background:var(--card);border-radius:22px;padding:24px;text-align:center;max-width:380px;width:100%}
#res h2{font-size:22px;margin-bottom:6px}
#res p{color:var(--mut);font-size:14px;margin-bottom:14px;line-height:1.4}
#res .big{font-size:34px;font-weight:900;color:var(--ok);margin-bottom:6px}
#res button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;margin:4px}
.pop{position:fixed;font-weight:900;font-size:22px;pointer-events:none;animation:up .9s forwards;transform:translateX(-50%);text-shadow:0 2px 0 rgba(0,0,0,.45);z-index:20}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes st{from{transform:rotate(-10deg) scale(2);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="hub" class="scr">
 <h1>🏭 DÉFOULOIR<br>DU DOCK</h1>
 <div class="sub">Le jeu qui fait du bien après une longue semaine</div>
 <div class="meter"><div class="row"><span>Niveau de stress</span><span id="pc">100 %</span></div><div class="bar"><div id="fill"></div></div></div>
 <div id="zen"></div>
 <div class="tg"><button id="bs" onclick="tg1()">🔊 Sons : OUI</button><button id="bv" onclick="tg2()">🗣️ Voix : OUI</button></div>
 <button class="card" onclick="start(0)"><i>🔨</i><div><b>Taupe-Cadre</b><small>Ils sortent des cartons, chacun avec ses points. Pas le collègue, ni le chat !</small></div></button>
 <button class="card" onclick="start(3)"><i>🎯</i><div><b>Fléchettes</b><small>Vise le centre quand le viseur passe. La cible change toutes les 3 fléchettes.</small></div></button>
 <button class="card" onclick="start(4)"><i>🎈</i><div><b>Crève-ballons</b><small>Chaque cadre est dans un ballon. Pop ! Ils perdent leur sérieux.</small></div></button>
 <button class="card" onclick="start(5)"><i>🖨️</i><div><b>Casse-bureau</b><small>L’imprimante, le fax, le téléphone… tape jusqu’au bourrage final.</small></div></button>
 <button class="card" onclick="start(1)"><i>📨</i><div><b>Tampon REFUSÉ</b><small>Les mails pénibles pleuvent : tamponne-les. Valide les bonnes nouvelles !</small></div></button>
 <button class="card" onclick="start(2)"><i>🗣️</i><div><b>Bingo de réunion</b><small>Ils enchaînent les mots creux. Coche-les dès qu’ils les disent.</small></div></button>
 <div id="tot"></div>
 <div class="team">Distribution : David (Directeur) · Antony (Adjoint) · Arnaud (RH) · Samir, Tarek, Mathieu, Gislaine (Cadres). Jeu pour rire entre collègues, en toute amitié 😄</div>
</div>
<div id="game" class="scr hid">
 <div class="top"><button onclick="back()">← Menu</button><span id="gn"></span><b id="tm"></b><b id="sc"></b></div>
 <div id="cap"></div>
 <div id="board"></div>
</div>
<div id="res"><div><h2 id="rt"></h2><div class="big" id="rs"></div><p id="rp"></p><button onclick="start(g)">Rejouer</button><button onclick="back()">Menu</button></div></div>
<script>
const $=id=>document.getElementById(id),R=a=>a[Math.random()*a.length|0];
let ac=null,tot=0,stress=100,score=0,t=0,g=0,run=false,combo=0,iv=[],raf=0,tick=0,uid=0,SON=true,VOX=true,ml=[],lt=0;
// ===== PERSONNAGES =====
const P=[
{n:"David",s:"Directeur",e:"🕴️",p:50,w:6},
{n:"Antony",s:"Directeur adjoint",e:"🤵",p:35,w:9},
{n:"Arnaud",s:"RH",e:"🧐",p:25,w:11},
{n:"Samir",s:"Cadre",e:"👨‍💼",p:20,w:14},
{n:"Tarek",s:"Cadre",e:"👨‍💼",p:20,w:14},
{n:"Mathieu",s:"Cadre",e:"👨‍💼",p:20,w:14},
{n:"Gislaine",s:"Cadre",e:"👩‍💼",p:20,w:14}];
const LN={
"Directeur":["« Je n’ai pas le temps pour ça, j’ai une vision ! »","« Qui a posé un carton ici ?! »","« Je réfléchis à ma stratégie… depuis le sol. »"],
"Directeur adjoint":["« C’est David qui décide ! »","« Je valide… non attends, je valide pas ! »","« Je vais en parler à David. »"],
"RH":["« Cet incident sera consigné. »","« Je vais ouvrir un dossier… »","« Parlons-en en entretien, avec un café. »"],
"Cadre":["« Pas dans mon périmètre ! »","« Mon KPI !! »","« On peut en discuter calmement ? »","« J’avais prévu un point là-dessus. »"]};
function pickP(){let s=P.reduce((a,p)=>a+p.w,0)*Math.random();for(const p of P){s-=p.w;if(s<=0)return p}return P[3]}
// ===== SONS RIGOLOS =====
function tone(ty,f1,f2,v,d){if(!SON)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();const o=ac.createOscillator(),k=ac.createGain(),n=ac.currentTime;o.type=ty;o.frequency.setValueAtTime(f1,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d*.8);k.gain.setValueAtTime(v,n);k.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(k);k.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
const SFX={
 boing:()=>{tone("sine",180,720,.2,.22);setTimeout(()=>tone("sine",720,260,.15,.2),120)},
 whistle:()=>tone("sine",1900,260,.12,.4),
 bonk:()=>tone("triangle",420,70,.4,.18),
 pouet:()=>{tone("square",190,120,.1,.28);tone("square",197,125,.1,.28)},
 squeak:()=>{tone("square",500,1500,.07,.12);tone("sine",900,300,.08,.16)},
 wah:()=>{tone("sawtooth",330,240,.1,.22);setTimeout(()=>tone("sawtooth",290,170,.1,.3),230)},
 thud:()=>{tone("sine",140,40,.5,.25);tone("square",90,50,.1,.1)},
 ding:()=>{tone("sine",880,0,.12,.25);setTimeout(()=>tone("sine",1320,0,.1,.3),90)},
 buzz:()=>tone("sawtooth",110,80,.12,.3),
 pop:()=>{tone("square",900,100,.15,.09);tone("sine",300,60,.3,.12)},
 boom:()=>{tone("sawtooth",160,30,.5,.5);tone("square",80,30,.3,.4)},
 win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone("triangle",f,0,.12,.25),i*110)),
 blip:()=>tone("sine",300,420,.05,.1)};
const rf=()=>R([SFX.boing,SFX.whistle,SFX.bonk,SFX.pouet,SFX.squeak,SFX.wah])();
function voice(s){if(!VOX||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang="fr-FR";u.pitch=1+Math.random();u.rate=1.15;speechSynthesis.speak(u)}catch(e){}}
const vx=p=>{if(Math.random()<.6)voice(p.n+" ! "+R(["Aïe !","Ouille !","Pas ma tête !","Mon KPI !"]))};
function tg1(){SON=!SON;$("bs").textContent="🔊 Sons : "+(SON?"OUI":"NON")}
function tg2(){VOX=!VOX;$("bv").textContent="🗣️ Voix : "+(VOX?"OUI":"NON")}
// ===== OUTILS =====
const T=(f,ms)=>{const id=setTimeout(()=>{if(run)f()},ms);iv.push(id);return id};
const say=s=>$("cap").textContent=s;
function pop(x,y,s,c){const e=document.createElement("div");e.className="pop";e.textContent=s;e.style.left=x+"px";e.style.top=y+"px";e.style.color=c;document.body.appendChild(e);setTimeout(()=>e.remove(),900)}
function popAt(el,s,c){const r=el.getBoundingClientRect();pop(r.left+r.width/2,r.top+r.height/3,s,c)}
function shake(){document.body.classList.remove("shk");void document.body.offsetWidth;document.body.classList.add("shk")}
function add(p){score=Math.max(0,score+p);$("sc").textContent="💶 "+score}
const mult=()=>1+(combo/5|0);
const cb=()=>combo>2?"  🔥 combo ×"+combo:"";
const NAMES=["🔨 Taupe-Cadre","📨 Tampon REFUSÉ","🗣️ Bingo de réunion","🎯 Fléchettes","🎈 Crève-ballons","🖨️ Casse-bureau"];
const INTRO=["Tape les cadres. Plus ils sont haut placés, plus ça rapporte !","Tamponne les mails pénibles. Valide les bonnes nouvelles !","Ils parlent. Coche les mots dès qu’ils sont dits !","Tape l’écran quand le viseur ✛ est au centre !","Pop ! Crève les ballons avant qu’ils s’envolent.","Tape tape tape ! Défonce tout ce qui est en panne."];
const DUR=[40,45,60,40,45,30],TH=[700,500,500,500,700,450];
function stopAll(){iv.forEach(clearTimeout);iv=[];clearInterval(tick);cancelAnimationFrame(raf);try{speechSynthesis.cancel()}catch(e){}}
function start(n){
 stopAll();g=n;score=0;combo=0;t=DUR[n];run=true;ml=[];lt=0;
 $("hub").classList.add("hid");$("game").classList.remove("hid");$("res").classList.remove("s");
 $("gn").textContent=NAMES[n];$("tm").textContent="⏱ "+t;$("sc").textContent="💶 0";say(INTRO[n]);
 $("board").className="b"+n;$("board").innerHTML="";$("board").onpointerdown=null;
 [initT,initM,initB,initD,initL,initP][n]();
 tick=setInterval(()=>{if(!run)return;t--;$("tm").textContent="⏱ "+t;if(t<=0)end()},1000);
}
function end(){
 run=false;stopAll();tot+=score;stress=Math.max(0,stress-score/TH[g]*25);
 const r=score/TH[g];
 $("rt").textContent=r<.3?"Stagiaire du défoulement":r<.6?"Ouvrier zen":r<1?"Délégué syndical du fun":"Légende du Dock 🏆";
 $("rs").textContent=score+" € de prime";
 $("rp").textContent=r>=.6?"Ton stress s’envole. Les cadres, eux, ont une réunion pour en parler.":"Pas mal ! Une dernière partie pour finir la semaine sereinement ?";
 $("res").classList.add("s");SFX.win();
}
function back(){run=false;stopAll();$("res").classList.remove("s");$("game").classList.add("hid");$("hub").classList.remove("hid");hub()}
function hub(){
 $("pc").textContent=Math.round(stress)+" %";$("fill").style.width=stress+"%";$("fill").style.backgroundPosition=(100-stress)+"% 0";
 $("tot").textContent="Prime de défoulement totale : "+tot+" €";
 $("zen").textContent=stress<=0?"🧘 ZEN ATTEINT ! Tu peux rentrer chez toi.":"";
}
function mover(dir,off,miss){
 raf=requestAnimationFrame(now=>{
  if(!run)return;
  const dt=Math.min(.05,(now-(lt||now))/1000),H=$("board").clientHeight;lt=now;
  ml.forEach(o=>{if(!o.done){o.y+=dir*o.sp*dt;o.e.style.transform="translateY("+o.y+"px)"}});
  ml.filter(o=>!o.done&&off(o,H)).forEach(o=>{o.done=1;miss(o);o.e.remove()});
  ml=ml.filter(o=>!o.done);mover(dir,off,miss);
 });
}
// ===== 0. TAUPE-CADRE =====
const K=[...P.map(p=>({t:"p",p,w:p.w})),{t:"o",w:9},{t:"k",w:7},{t:"b",w:6}];
const QO=["Aïe ! C’est ton collègue ! Il avait ton café…","Ton collègue te regarde. Longtemps.","Mauvais carton, mauvais collègue."];
function initT(){
 let h="";for(let i=0;i<9;i++)h+='<div class="hole"><div class="m"></div><div class="rim"></div></div>';
 $("board").innerHTML=h;
 document.querySelectorAll(".hole").forEach(el=>el.onpointerdown=()=>hitT(el));
 spawnT();
}
function spawnT(){
 const hs=[...document.querySelectorAll(".hole")].filter(h=>!h.dataset.k);
 if(hs.length){
  let s=K.reduce((a,k)=>a+k.w,0)*Math.random(),k=K[0];for(const x of K){s-=x.w;if(s<=0){k=x;break}}
  const h=R(hs),id=++uid,m=h.firstChild;
  h.dataset.k=k.t;h.dataset.id=id;h._p=k.p;
  m.innerHTML="<span>"+(k.p?k.p.e:k.t==="o"?"👷":k.t==="k"?"🐈":"💶")+"</span><small>"+(k.p?k.p.n:k.t==="o"?"Collègue":k.t==="k"?"Le chat":"Prime")+"</small>";
  m.classList.add("up");
  T(()=>{if(h.dataset.id==id&&h.dataset.k){if(h.dataset.k==="p")combo=0;delete h.dataset.k;m.classList.remove("up")}},Math.max(560,1150-(40-t)*14));
 }
 T(spawnT,Math.max(380,720-(40-t)*9));
}
function hitT(h){
 const k=h.dataset.k;if(!k)return;
 delete h.dataset.k;h.dataset.id=0;const m=h.firstChild,p=h._p;m.firstChild.textContent="💥";
 if(k==="p"){combo++;const pts=p.p*mult();add(pts);say(p.n+" ("+p.s+") : "+R(LN[p.s])+cb());rf();vx(p);popAt(h,"+"+pts,"#fab005")}
 else if(k==="o"){combo=0;add(-15);say(R(QO));SFX.buzz();popAt(h,"−15","#ff6b6b")}
 else if(k==="k"){combo=0;add(-10);say("Miaou. Le chat de l’entrepôt est sacré.");SFX.buzz();popAt(h,"−10","#ff6b6b")}
 else{add(60);say("💶 PRIME ATTRAPÉE ! Le syndicat applaudit.");SFX.ding();popAt(h,"+60","#69db7c")}
 shake();T(()=>m.classList.remove("up"),260);
}
// ===== 1. TAMPON REFUSÉ =====
const BAD=["🔥 URGENT pour hier","Réunion vendredi 17h59","Peux-tu faire plus avec moins ?","Petit point rapide ? (2 h)","Merci de revenir vers moi ASAP","Re: Re: Re: URGENT","Samedi, ça te dit ?","Nouveau process (le 5e ce mois-ci)","Rappel : sourire en réunion"];
const GOOD=["💶 Prime exceptionnelle","🏖️ Congés validés !","📈 Augmentation +300 €","🍕 Pizza offerte","⏰ Fin de poste en avance"];
function initM(){spawnM();mover(1,(o,H)=>o.y>H-24,o=>{if(!o.good){combo=0;say("📬 Encore un dans ta boîte…");SFX.buzz()}})}
function spawnM(){
 const bd=$("board"),good=Math.random()<.22,p=good?R([P[0],P[1]]):pickP(),e=document.createElement("div");
 e.className="mail"+(good?" g":"");e.innerHTML="<small>De : <b>"+p.n+"</b> ("+p.s+")</small><br>"+R(good?GOOD:BAD);
 e.style.left=Math.random()*Math.max(10,bd.clientWidth-180)+"px";bd.appendChild(e);
 const o={e,y:-70,good,p,sp:70+Math.random()*40+(45-t)*2.2,done:0};ml.push(o);
 e.onpointerdown=()=>stampM(o);
 T(spawnM,Math.max(430,950-(45-t)*11));
}
function stampM(o){
 if(o.done)return;o.done=1;
 o.e.dataset.s=o.good?"VALIDÉ ✅":"REFUSÉ";o.e.classList.add("st");
 if(o.good){add(40);say("🎉 "+o.p.n+" a enfin une bonne nouvelle !");SFX.ding();popAt(o.e,"+40","#69db7c")}
 else{combo++;const pts=Math.round(o.p.p/2*mult());add(pts);say(o.p.n+" : REFUSÉ !"+cb());SFX.thud();rf();shake();popAt(o.e,"+"+pts,"#fab005")}
 setTimeout(()=>o.e.remove(),420);
}
// ===== 2. BINGO DE RÉUNION =====
const W={"synergie":"Il nous manque de la synergie entre les équipes.","on fait un point":"On fait un petit point rapide ? Prévoyez 2 h.","KPI":"Mon KPI, c’est ton KPI.","quick win":"Il nous faut un quick win pour lundi.","faire plus avec moins":"Il va falloir faire plus avec moins.","ASAP":"Je te le demande pour ASAP, soit hier.","remonter l’info":"Merci de remonter l’info. À qui ? À moi.","pivoter":"On va devoir pivoter, c’est un changement d’ADN.","valeur ajoutée":"Où est la valeur ajoutée de votre pause ?","deadline serrée":"Deadline serrée : c’était pour la semaine dernière.","challenge":"Ce n’est pas un problème, c’est un challenge !","bande passante":"Je n’ai pas la bande passante pour ça.","en transversal":"On va traiter ça en transversal.","revenir vers toi":"Je reviens vers toi. (Il ne reviendra pas.)","proactif":"J’attends de vous que vous soyez proactifs.","périmètre":"Ce n’est pas dans mon périmètre.","agile":"Nous sommes agiles, donc tout change tout le temps.","reporting":"Un petit reporting quotidien, rien de méchant.","se caler":"On se cale ça quand ? Jamais, parfait.","low hanging fruit":"Commençons par les low hanging fruits."};
let bw=[],said={},mk=[];
const LS=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function initB(){$("board").innerHTML='<div id="spk"><span>🧑‍💼</span><div id="sp">La réunion commence…</div></div><div id="bg"></div>';newB();T(speakB,1200)}
function newB(){
 bw=Object.keys(W).sort(()=>Math.random()-.5).slice(0,9);said={};mk=Array(9).fill(0);
 $("bg").innerHTML=bw.map((w,i)=>'<button class="cell" data-i="'+i+'">'+w+'</button>').join("");
 document.querySelectorAll(".cell").forEach(el=>el.onpointerdown=()=>cellB(el));
}
function speakB(){
 const un=bw.filter(w=>!said[w]),w=(Math.random()<.65&&un.length)?R(un):R(Object.keys(W)),p=pickP();
 said[w]=1;$("spk").firstChild.textContent=p.e;$("sp").textContent=p.n+" ("+p.s+") : « "+W[w]+" »";SFX.blip();
 T(speakB,2700);
}
function cellB(el){
 const i=+el.dataset.i,w=bw[i];if(mk[i])return;
 if(said[w]){
  mk[i]=1;el.classList.add("on");add(10);SFX.ding();popAt(el,"+10","#fab005");
  if(LS.some(l=>l.every(k=>mk[k]))){add(100);say("🎉 BINGO ! Ils sont à court de mots.");SFX.win();shake();T(newB,900)}
 }else{SFX.buzz();el.classList.remove("no");void el.offsetWidth;el.classList.add("no");say("Pas encore dit ! Patience, ils vont le sortir.")}
}
// ===== 3. FLÉCHETTES =====
let tg=null,dn=0,sp=1,xx=0,yy=0;
function initD(){
 $("board").innerHTML='<div id="dw"><div id="dbd"><div id="xh">✛</div></div></div>';
 dn=0;sp=1;newTarget();
 $("board").onpointerdown=throwD;loopD();
}
function newTarget(){tg=pickP();say("Cible : "+tg.e+" "+tg.n+" ("+tg.s+") · ×"+(tg.p/20))}
function loopD(){
 raf=requestAnimationFrame(ts=>{
  if(!run)return;
  xx=Math.cos(ts/1000*1.7*sp)*.95;yy=Math.sin(ts/1000*2.3*sp)*.95;
  const x=$("xh");if(x){x.style.left=(50+xx*50)+"%";x.style.top=(50+yy*50)+"%"}
  loopD();
 });
}
function throwD(){
 if(!run)return;
 const r=Math.hypot(xx,yy),ring=r<.08?50:r<.16?30:r<.4?15:r<.7?8:3,pts=Math.round(ring*tg.p/20);
 const d=document.createElement("div");d.className="dt";d.textContent="📍";d.style.left=(50+xx*50)+"%";d.style.top=(50+yy*50)+"%";$("dbd").appendChild(d);
 add(pts);const el=$("dbd");
 if(ring>=30){say((ring===50?"🎯 EN PLEIN DANS LE MILLE ! ":"")+tg.n+" : "+R(LN[tg.s]));rf();vx(tg);shake()}
 else{say(tg.n+" a senti un courant d’air…");SFX.thud()}
 popAt(el,"+"+pts,ring>=30?"#fab005":"#fff");
 sp+=.04;dn++;if(dn%3===0)setTimeout(newTarget,900);
}
// ===== 4. CRÈVE-BALLONS =====
const COL=["#fa5252","#fab005","#40c057","#339af0","#cc5de8","#ff922b"];
function initL(){spawnL();mover(-1,o=>o.y<-110,()=>{combo=0})}
function spawnL(){
 const bd=$("board"),p=pickP(),e=document.createElement("div");
 e.className="bl";e.innerHTML="<i>"+p.e+"</i><small>"+p.n+"</small>";
 e.style.left=Math.random()*Math.max(10,bd.clientWidth-80)+"px";e.style.background=R(COL);bd.appendChild(e);
 const o={e,y:bd.clientHeight+10,p,sp:60+Math.random()*50+(45-t)*2,done:0};ml.push(o);
 e.onpointerdown=()=>popL(o);
 T(spawnL,Math.max(420,900-(45-t)*10));
}
function popL(o){
 if(o.done)return;o.done=1;combo++;const pts=o.p.p*mult();add(pts);
 popAt(o.e,"+"+pts,"#fab005");o.e.remove();SFX.pop();rf();vx(o.p);
 say(o.p.n+" ("+o.p.s+") perd son sérieux !"+cb());
}
// ===== 5. CASSE-BUREAU =====
const OB=[["🖨️",["Bourrage papier. Encore.","« Veuillez remplacer la cartouche noire. »","« Erreur 0x80 : désolée. »"]],["🖥️",["Il met 12 minutes à démarrer. Il en met 0 à mourir.","« Mise à jour : 3 %… »"]],["☎️",["Il sonnait toujours à 17h59.","« Je vous mets en attente… »"]],["📠",["Personne ne savait qu’il marchait encore.","Le fax est mort. Longue vie à l’email."]]];
let hp=100,oi=0;
function initP(){
 hp=100;oi=0;
 $("board").innerHTML='<div id="pw"><div id="pe">🖨️</div><div class="bar pb"><div id="ph" style="height:100%;width:100%;background:var(--ko);transition:width .1s"></div></div></div>';
 $("board").onpointerdown=hitP;
}
function hitP(ev){
 if(!run)return;
 hp-=8+Math.random()*8;add(3);rf();
 const pe=$("pe");pe.classList.remove("hit");void pe.offsetWidth;pe.classList.add("hit");
 pop(ev.clientX,ev.clientY,R(["PAF !","BONK !","POUET !","CLANG !","📄","💥"]),"#fab005");
 $("ph").style.width=Math.max(0,hp)+"%";
 if(Math.random()<.2)say(R(OB[oi%4][1]));
 if(hp<=0){add(60);say("💥 Bourrage définitif ! +60");SFX.boom();shake();oi++;hp=100;pe.textContent=OB[oi%4][0];$("ph").style.width="100%"}
}
hub();
</script>

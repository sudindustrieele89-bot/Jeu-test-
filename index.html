<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Défouloir du Dock</title>
<style>
:root{--bg1:#fff1cc;--bg2:#ffc873;--tx:#2b2118;--card:#fff;--ac:#e8590c;--ok:#2f9e44;--ko:#e03131;--mut:#6b5b4b;--hole:#7a4a21;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#241a10;--bg2:#3d2a15;--tx:#fdf3e3;--card:#33261a;--ac:#ff922b;--ok:#69db7c;--ko:#ff8787;--mut:#c9b79f;--hole:#4a2c12}}
*{margin:0;padding:0;box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body.shk{animation:shk .22s}
body.fury{animation:fz 1s infinite}
.scr{height:100%;max-width:560px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:9px}
#hub{overflow-y:auto}
.hid{display:none!important}
h1{font-size:26px;text-align:center;line-height:1.1}
.sub{text-align:center;color:var(--mut);font-size:13px}
.box{background:var(--card);border-radius:14px;padding:10px 12px}
.row{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:6px}
.bar{height:12px;border-radius:8px;background:rgba(127,127,127,.25);overflow:hidden}
.bar>i{display:block;height:100%;width:100%;border-radius:8px;background:var(--ok);transition:width .3s}
#fill{background:linear-gradient(90deg,var(--ok),#fab005,var(--ko));background-size:300% 100%;transition:width .5s,background-position .5s}
.tg,.tbtns,.grid2{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tbtns button,.grid2 button{flex:1}
.btn{background:var(--card);border:2px solid var(--ac);color:var(--ac);border-radius:14px;padding:7px 11px;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.btn.big{font-size:20px;padding:18px;width:100%;background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc{background:var(--card);border:0;border-radius:16px;padding:10px;font:inherit;color:var(--tx);text-align:left;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.gc:active{transform:translateY(2px);box-shadow:none}
.gc i{font-style:normal;font-size:28px;display:block}
.gc b{display:block;font-size:13px;margin-top:2px}
.gc small{color:var(--mut);font-size:11px;line-height:1.25}
.team{font-size:11px;color:var(--mut);text-align:center;line-height:1.4;padding-bottom:6px}
#tot,#zen{text-align:center;font-weight:800}
#zen{color:var(--ok)}
#badges{font-size:12px;text-align:center}
.top{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px}
.top span{flex:1;text-align:center}
#cap{min-height:44px;background:var(--card);border-radius:14px;padding:9px 12px;font-size:14px;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center}
#narr{font-size:12px;font-style:italic;color:var(--mut);text-align:center;min-height:30px}
#board{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:16px;touch-action:none}
#board.colb{display:flex;flex-direction:column;gap:10px;padding:10px}
#board.gridb{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:10px}
#board.gridb2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:10px;padding:10px}
#board.races{display:flex;flex-direction:column;justify-content:center;padding:10px}
.hole{position:relative;aspect-ratio:1;background:var(--hole);border-radius:50% 50% 14px 14px;overflow:hidden;box-shadow:inset 0 -10px 0 rgba(0,0,0,.35);cursor:pointer}
.m{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateY(105%);transition:transform .14s}
.m.up{transform:translateY(4%)}
.m span{font-size:min(13vw,56px);line-height:1}
.m small{font-size:11px;font-weight:800;background:var(--card);color:var(--tx);border-radius:8px;padding:1px 6px;margin-top:2px}
#board.holes{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;padding:10px}
#board.holes .hole{aspect-ratio:auto;height:100%;min-height:0}
.tg{position:absolute;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--ko),0 4px 10px rgba(0,0,0,.35);transition:none}
.tg span{font-size:30px;line-height:1}
.tg small{position:absolute;bottom:-18px;font-size:10px;font-weight:800;white-space:nowrap;background:var(--card);border-radius:6px;padding:0 5px}
.rim{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#c9904f,#a0692f);border-radius:0 0 14px 14px}
.mail{position:absolute;top:0;left:0;width:170px;background:#fff;color:#222;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;border-left:6px solid var(--ko);box-shadow:0 3px 8px rgba(0,0,0,.3);cursor:pointer;will-change:transform}
.mail small{font-weight:600;font-size:11px;opacity:.75}
.mail.g{border-left-color:var(--ok);background:#ebfbee}
.mail.urg{border-left-color:#e03131;background:#ffe3e3}
.mail.st::after{content:attr(data-s);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:var(--ko);background:rgba(255,255,255,.9);border:4px solid currentColor;border-radius:8px;transform:rotate(-10deg) scale(1.15);animation:st .25s}
.mail.g.st::after{color:var(--ok)}
.bl{position:absolute;top:0;width:76px;height:96px;border-radius:50% 50% 48% 48%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;will-change:transform;box-shadow:inset -8px -8px 0 rgba(0,0,0,.15)}
.bl i{font-style:normal;font-size:34px}
.bl small{font-size:11px;font-weight:800;background:rgba(255,255,255,.9);color:#222;border-radius:8px;padding:0 5px}
#dw{height:100%;display:flex;align-items:center;justify-content:center}
#dbd{width:min(88vw,50vh,460px);aspect-ratio:1;border-radius:50%;position:relative;background:radial-gradient(circle,#e03131 0 8%,#2f9e44 8% 16%,#fff 16% 40%,#222 40% 48%,#e03131 48% 70%,#222 70% 100%);box-shadow:0 0 0 8px #7a4a21,0 8px 20px rgba(0,0,0,.4)}
#xh{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-size:34px;color:#fab005;text-shadow:0 0 4px #000,0 0 8px #000;font-weight:900}
.dt{position:absolute;transform:translate(-50%,-50%);font-size:24px;pointer-events:none;animation:fade 1.6s forwards}
#pw{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#pe{font-size:min(45vw,190px);line-height:1}
#pe.hit{animation:shk .18s}
.pb{width:70%}
#ph{display:block;height:100%;width:100%;border-radius:8px;background:var(--ko);transition:width .1s}
#wind{position:absolute;top:8px;left:0;right:0;text-align:center;font-weight:800;font-size:14px}
#bask{position:absolute;top:18%;left:50%;transform:translate(-50%,-50%);font-size:52px;pointer-events:none}
#ball{position:absolute;left:50%;top:88%;transform:translate(-50%,-50%);font-size:34px;pointer-events:none}
.carton{background:#c9904f;border-radius:12px;color:#fff;font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -8px 0 rgba(0,0,0,.2);transition:transform .3s,opacity .3s;cursor:pointer}
.carton small{font-size:11px;background:rgba(0,0,0,.45);border-radius:6px;padding:0 5px}
.carton.gone{transform:translateY(200px) rotate(30deg);opacity:0;pointer-events:none}
.lane{display:flex;flex-direction:column;gap:2px;margin:6px 2px}
.lane small{font-size:11px;font-weight:800}
.trk{position:relative;height:42px;background:rgba(127,127,127,.2);border-radius:21px}
.lane.me .trk{background:rgba(74,222,128,.28)}
.trk span{position:absolute;top:0;transform:translateX(-50%);font-size:30px;line-height:42px}
.qo{background:var(--card);border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;color:var(--tx);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15);text-align:left}
.qo.ok{background:var(--ok);color:#fff}
.qo.ko{background:var(--ko);color:#fff}
#tcard b{display:block}
#slot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#reels{display:flex;gap:10px}
.rl{width:84px;height:100px;background:var(--card);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
#sres{font-weight:900;min-height:24px;text-align:center}
.pad{background:var(--card);border:0;border-radius:16px;font:inherit;font-weight:800;color:var(--tx);box-shadow:0 4px 0 rgba(0,0,0,.2);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.pad span{font-size:34px}
.pad.hitp{transform:scale(.93)}
#tama{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#pet{font-size:110px;animation:bob 1.4s infinite}
#tama .box{width:100%}
#beat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#dance{font-size:90px;animation:bob .6s infinite}
#ring{width:150px;height:150px;border-radius:50%;border:6px solid var(--ac)}
#ring.pl{animation:pl .6s}
#bmsg{font-weight:900;min-height:24px;text-align:center}
#boss{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#bossd{font-size:130px;cursor:pointer;animation:bob 1s infinite}
.bb{width:80%;height:18px}
#bph{font-weight:900;text-align:center}
.pp{position:absolute;inset:0;background:rgba(255,255,255,.96);color:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:900;text-align:center;z-index:5}
.pp small{font-size:13px;font-weight:600}
.duel{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:10px}
.dbtn{flex:1;font-size:26px;font-weight:900;border:0;border-radius:18px;background:var(--ac);color:#fff;cursor:pointer}
#dmid{text-align:center;font-weight:900;font-size:17px}
.evb{position:absolute;top:8px;left:8px;right:8px;background:#fff;color:#222;border-radius:14px;padding:10px;font-weight:800;text-align:center;z-index:8;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.evb button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:800;margin-top:6px;cursor:pointer;width:100%}
.evb .inv button{background:#339af0}
.fly{position:absolute;left:-45%;padding:10px 14px;background:#e03131;color:#fff;font-weight:900;border-radius:10px;animation:flyr 2s linear forwards;z-index:6;cursor:pointer;white-space:nowrap}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}
.ovl.s{display:flex}
.ovl>div{background:var(--card);border-radius:22px;padding:22px;text-align:center;max-width:400px;width:100%;max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:8px;align-items:center}
.ovl h2{font-size:21px}
.ovl p{font-size:13px;color:var(--mut);line-height:1.4}
.ovl .big{font-size:34px;font-weight:900;color:var(--ok)}
.ovl textarea{width:100%;font:12px ui-monospace,monospace;border-radius:10px;padding:8px;border:1px solid var(--mut);background:var(--bg1);color:var(--tx)}
.pay{width:100%;text-align:left;font-size:13px;display:flex;flex-direction:column;gap:6px}
.pay div{display:flex;justify-content:space-between;gap:8px}
#wh{width:240px;height:240px;border-radius:50%;margin:8px auto;transition:transform 3.2s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 0 6px var(--card)}
#wptr{font-size:26px;color:var(--ko);line-height:1}
#wres{font-weight:900;min-height:40px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;font-size:13px;z-index:40;animation:fade 2.6s forwards;white-space:nowrap}
.pop{position:fixed;font-weight:900;font-size:22px;pointer-events:none;animation:up .9s forwards;transform:translateX(-50%);text-shadow:0 2px 0 rgba(0,0,0,.45);z-index:20}
.bm{position:fixed;left:50%;top:36%;font-size:48px;font-weight:900;color:#fff;-webkit-text-stroke:2px #e03131;text-shadow:0 4px 0 #e03131;pointer-events:none;z-index:25;animation:bm .6s forwards}
.conf{position:fixed;top:-30px;font-size:22px;animation:fall 1.6s linear forwards;pointer-events:none;z-index:25}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
@keyframes bm{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes st{from{transform:rotate(-10deg) scale(2);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
@keyframes flyr{to{left:110%}}
@keyframes pl{from{transform:scale(.6);opacity:1}to{transform:scale(1.3);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#mgrid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:6px;padding:8px;min-height:0}
.mc{background:var(--card);border-radius:10px;font-size:11px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.15);line-height:1.2}
.mc.d{background:#d3f9d8}.mc.p{background:#ffe3e3}
.mcen{grid-row:2/4;grid-column:2/4;background:var(--card);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:13px;gap:8px}
#gw{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;width:min(92vw,400px);aspect-ratio:1;margin:auto}
.gcell{display:flex;align-items:center;justify-content:center;font-size:min(7vw,28px);background:var(--card);border-radius:6px}
.gcell.w{background:rgba(127,127,127,.4)}
.gpad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.gpad button{font-size:22px;padding:8px 16px;border-radius:12px;border:2px solid var(--ac);background:var(--card);cursor:pointer}
#board.gridm{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:6px;padding:8px}
.mcard{background:var(--ac);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:12px;font-weight:800;padding:4px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.mcard.open{background:var(--card);color:var(--tx)}
.mcard.done{opacity:.45}
#board.gridm .mcard span{font-size:34px}
#cv{background:#fff;border-radius:12px;width:100%;flex:1;min-height:0;touch-action:none}
.mlc{font-size:14px;line-height:1.5}
.pig{position:absolute;left:-15%;font-size:44px;text-align:center;cursor:pointer;animation-name:cross;animation-timing-function:linear;animation-fill-mode:forwards;line-height:1}
.pig small{display:block;font-size:10px;font-weight:800;background:var(--card);border-radius:6px;padding:0 4px;white-space:nowrap}
@keyframes cross{from{left:-15%}to{left:110%}}
.kwd{display:inline-block;margin:3px;padding:5px 8px;border-radius:8px;background:var(--card);cursor:pointer;font-weight:700;transition:transform .1s}
.kwd.lit{background:var(--gold);transform:scale(1.15)}
.kwd.done{background:var(--ok);color:#fff}
#kw{font-size:18px;line-height:2;text-align:center}
#sp{position:absolute;bottom:8%;font-size:48px;transform:translateX(-50%);transition:left .15s;pointer-events:none;line-height:1}
.it{position:absolute;font-size:40px;transform:translateX(-50%);pointer-events:none;line-height:1}
@keyframes fz{50%{filter:hue-rotate(50deg) saturate(1.6)}}
</style>
</head>
<body>
<div id="hub" class="scr">
 <h1>🏭 DÉFOULOIR<br>DU DOCK</h1>
 <div class="sub" id="sub"></div>
 <div class="box"><div class="row"><span>Niveau de stress</span><span id="pc"></span></div><div class="bar"><i id="fill"></i></div></div>
 <div id="zen"></div>
 <div class="tg" id="tools"></div>
 <div class="grid" id="grid"></div>
 <div class="box" id="badges"></div>
 <div id="tot"></div>
 <div class="team">Distribution : David (Directeur) · Antony (Adjoint) · Arnaud (RH) · Samir, Tarek, Mathieu, Gislaine (Cadres). Jeu pour rire entre collègues, en toute amitié 😄</div>
</div>

<div id="game" class="scr hid">
 <div class="top"><button class="btn" onclick="backHub()">← Menu</button><span id="gn"></span><b id="tm"></b><b id="sc"></b></div>
 <div id="cap"></div>
 <div id="narr"></div>
 <div id="board"></div>
</div>

<div id="res" class="ovl"><div><h2 id="rt"></h2><div class="big" id="rs"></div><p id="rp"></p><button class="btn big" onclick="startGame(G)">Rejouer</button><button class="btn" onclick="backHub()">Menu</button></div></div>
<div id="ov" class="ovl"><div id="ovb"></div></div>

<script>
const $=id=>document.getElementById(id);
const R=a=>a[Math.random()*a.length|0];
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

let SON=true,VOX=true,CAD=false,run=false,G=0,score=0,combo=0,t=0,ts=[],ivs=[],raf=0,rlast=0,lt=0,ml=[],fury=0,st=100,tot=0;
const STAT={hits:0,refus:0,meet:0,dodge:0,games:{}};
let UNL={};
try{UNL=JSON.parse(localStorage.getItem("dd_badges")||"{}")}catch(e){}

// ===== PERSONNAGES (modifiable dans 🛠️ Équipe) =====
let P=[
{n:"David",s:"Directeur",e:"🕴️",p:50,w:6,v:[.7,.9]},
{n:"Antony",s:"Directeur adjoint",e:"🤵",p:35,w:9,v:[.9,1]},
{n:"Arnaud",s:"RH",e:"🧐",p:25,w:11,v:[1.2,1.1]},
{n:"Samir",s:"Cadre",e:"👨‍💼",p:20,w:14,v:[1.4,1.2]},
{n:"Tarek",s:"Cadre",e:"👨‍💼",p:20,w:14,v:[1,1.3]},
{n:"Mathieu",s:"Cadre",e:"👨‍💼",p:20,w:14,v:[1.6,1]},
{n:"Gislaine",s:"Cadre",e:"👩‍💼",p:20,w:14,v:[1.5,1.25]}];
try{const s=localStorage.getItem("dd_team");if(s)P=JSON.parse(s)}catch(e){}
const OUV={n:"Un ouvrier",s:"Ouvrier",e:"👷",p:15,w:0};
const pickP=()=>{let s=P.reduce((a,p)=>a+(p.w||1),0)*Math.random();for(const p of P){s-=(p.w||1);if(s<=0)return p}return P[P.length-1]};

const LN={"Directeur":["« Je n’ai pas le temps, j’ai une vision ! »","« Qui a posé un carton ici ?! »"],"Directeur adjoint":["« C’est David qui décide ! »","« Je valide… non, attends, je valide pas ! »"],"RH":["« Cet incident sera consigné. »","« Parlons-en en entretien, avec un café. »"],"Cadre":["« Pas dans mon périmètre ! »","« Mon KPI !! »","« On peut en discuter calmement ? »"],"Ouvrier":["« Le café est chaud, la journée est longue. »"]};
const PL={"David":["« Je vais déléguer ma chute. »","« Dans ma vision, je restais debout. »"],"Antony":["« Je ne dis pas non, je dis « pas maintenant ». »","« C’est une décision collégiale, mais je suis seul. »"],"Arnaud":["« Merci de signer ma plainte contre le carton. »","« Ce n’est pas une sanction, c’est un câlin disciplinaire. »"],"Samir":["« Je ne suis pas en retard, je suis en avance sur demain ! »","« Je suis en copie, donc je suis innocent. »"],"Tarek":["« J’ai une idée, mais je la garde pour la réunion. »","« Faisons un tour de table… sur le tapis. »"],"Mathieu":["« Je propose un rétro-planning de ma chute. »","« Mon écran de veille est plus productif que moi. »"],"Gislaine":["« Qui a changé la couleur de mon tableur ?! »","« Je n’ai pas la réponse, mais j’ai une question ! »"]};

const MAZES=[
["S.#....",".##.##.","...x...","##.#.##","$..#...",".#.##.#","...#..E"],
["S...#..",".#.#.#.",".#...#.","x##.#.#","....$..","#.##.#.","....#.E"]];
let GRID=[],GM=0,GR=0,GC=0;
function initGPS(){GM=0;loadMaze()}
function loadMaze(){
 const m=MAZES[GM%MAZES.length];GRID=m.map(r=>r.split(""));
 for(let r=0;r<GRID.length;r++)for(let c=0;c<GRID[r].length;c++)if(GRID[r][c]==="S"){GR=r;GC=c;GRID[r][c]="."}
 $("board").className="colb";
 $("board").innerHTML='<div id="gw"></div><div class="gpad"><button onclick="gmv(-1,0)">⬆️</button><button onclick="gmv(0,-1)">⬅️</button><button onclick="gmv(1,0)">⬇️</button><button onclick="gmv(0,1)">➡️</button></div>';
 gdraw();
}
function gdraw(){
 const ICON={"#":"🧱",".":"·","x":"🚜","$":"💶","E":"🚪","S":"·"};
 let h="";
 GRID.forEach((row,r)=>row.forEach((ch,c)=>{
  const me=r===GR&&c===GC;
  h+='<div class="gcell'+(ch==="#"?" w":"")+'">'+(me?"🧑‍💼":ICON[ch])+'</div>';
 }));
 $("gw").innerHTML=h;
}
function gmv(dr,dc){
 if(!run)return;
 const nr=GR+dr,nc=GC+dc;
 if(nr<0||nc<0||nr>=GRID.length||nc>=GRID[nr].length)return;
 const ch=GRID[nr][nc];
 if(ch==="#")return;
 if(ch==="x"){add(-10);combo=0;say("🚜 Un chariot ! -10, tu recules.");SFX.bonk();shake();return}
 GR=nr;GC=nc;
 if(ch==="$"){add(20);GRID[nr][nc]=".";say("💶 Une prime ! +20");SFX.ding()}
 if(ch==="E"){add(100);GM++;say("🚪 SORTIE ! Le cadre est dehors. +100. Labyrinthe suivant !");SFX.win();loadMaze();return}
 gdraw();
}

function placeSp(){const e=$("sp");if(e)e.style.left=LX[SLane]+"%"}
function spawnSig(){
 const lane=R([0,1,2]),k=Math.random()<.55?"✍️":Math.random()<.5?"🗂️":"📦",e=document.createElement("div");
 e.className="it";e.style.left=LX[lane]+"%";e.style.top="-50px";e.textContent=k;$("sg").appendChild(e);
 SIt.push({e,lane,k,y:-50,done:0});

function sigLoop(){
 raf=requestAnimationFrame(now=>{
  if(!run)return;
  const H=$("board").clientHeight,dt=Math.min(.05,(now-(sLast||now))/1000);sLast=now;
  SIt.forEach(it=>{
   it.y+=(170+(45-t)*2)*dt;it.e.style.top=it.y+"px";
   if(!it.done&&it.lane===SLane&&it.y>H-95&&it.y<H-30){
    it.done=1;
    if(it.k==="✍️"){add(20);say("✍️ Signature obtenue ! +20");SFX.ding();popAt(it.e,"+20")}
    else if(it.k==="🗂️"){add(-15);combo=0;say("🗂️ Dossier urgent ! -15");SFX.bonk();shake()}
    else{add(-10);combo=0;say("📦 Carton dans les pieds ! -10");SFX.thud();shake()}
   }
  });
  SIt=SIt.filter(it=>{if(it.y>H+20||it.done){it.e.remove();return false}return true});
  sigLoop();
 });
}

 openOv("<h2>🛠️ Équipe</h2><p>Modifie les personnages en JSON. Champs : n (prénom), s (poste), e (emoji), p (points), w (fréquence), v ([voix aiguë, vitesse]).</p><textarea id='tx' rows='10'>"+JSON.stringify(P,null,1)+"</textarea><button class='btn' onclick='saveTeam()'>💾 Enregistrer</button><button class='btn' onclick='resetTeam()'>↺ Réinitialiser</button><p id='terr'></p>");
}
function saveTeam(){
 try{const a=JSON.parse($("tx").value);if(!Array.isArray(a)||!a.length)throw 1;a.forEach(x=>{if(!x.n||!x.s||typeof x.p!=="number")throw 1});P=a;localStorage.setItem("dd_team",JSON.stringify(a));toast("Équipe enregistrée ✔");closeOv()}
 catch(e){$("terr").textContent="⚠️ JSON invalide : vérifie les virgules et les champs n, s, p."}
}
function resetTeam(){try{localStorage.removeItem("dd_team")}catch(e){}location.reload()}
function openWheel(){
 const bg="conic-gradient("+COLS8.map((c,i)=>c+" "+i*45+"deg "+(i+1)*45+"deg").join(",")+")";
 openOv("<h2>🎡 Roue du vendredi</h2><div id='wptr'>▼</div><div id='wh' style='background:"+bg+"'></div><div id='wres'>Tourne la roue !</div><button class='btn big' onclick='spinW()'>🎲 Tourner</button>");
}
function spinW(){
 const i=Math.random()*8|0,rot=1800+(360-(i*45+22.5));
 $("wh").style.transform="rotate("+rot+"deg)";$("wres").textContent="…";
 setTimeout(()=>{if($("wres"))$("wres").textContent="🎉 "+CHALL[i]},3300);
}
buildHub();
</script>
</body>
